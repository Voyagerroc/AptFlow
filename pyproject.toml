[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptflow-starter"
version = "0.1.0"
description = "Account-independent starter for specialist-tool workflows"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aptflow = "aptflow_core.cli:main"

[tool.setuptools.packages.find]
include = ["aptflow_core*"]

[tool.setuptools.package-data]
aptflow_core = ["demo-config.json"]
