name: aptflow
services:
  activepieces:
    image: ${ACTIVEPIECES_IMAGE:-activepieces/activepieces:latest}
    ports:
      - "127.0.0.1:8095:80"
    environment:
      AP_DB_TYPE: PGLITE
      AP_REDIS_TYPE: MEMORY
      AP_FRONTEND_URL: http://localhost:8095
    volumes:
      - activepieces_data:/root/.activepieces
volumes:
  activepieces_data:
