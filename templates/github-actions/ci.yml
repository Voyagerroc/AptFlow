name: Account-free checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24 runtime
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24 runtime
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Initialize synthetic configuration
        run: python aptflow.py init
      - name: Check readiness
        run: python aptflow.py doctor
      - name: Inspect workflow plan
        run: python aptflow.py plan
      - name: Run synthetic storyboard demo
        run: python aptflow.py run --out outputs/ci-demo
      - name: Verify demo boundaries
        run: python -c "import json; from pathlib import Path; r = json.loads(Path('outputs/ci-demo/report.json').read_text()); assert r['synthetic'] is True and r['external_calls'] == 0 and r['video_generated'] is False and r['status'] == 'demo_completed'"
